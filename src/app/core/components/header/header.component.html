<div
  class="flex justify-between w-full items-center py-4 px-1.5 bg-white border border-[#efefef] border-l-0"
>
  <button (click)="toggleSidebar()" class="cursor-pointer">
    <span
      class="material-symbols-outlined text-gray-400 p-1.5 hover:bg-gray-200 hover:text-gray-900 rounded-lg"
      >{{
        sidenavToggleService.sidebarVisible()
          ? "left_panel_close"
          : "left_panel_open"
      }}
    </span>
  </button>

  <img src="assets/images/logo.svg" alt="app logo" />

  <div (clickOutside)="closeMenu()" class="flex items-center">
    <div class="flex items-center ms-3">
      <div>
        <button
          type="button"
          class="flex text-sm bg-gray-800 rounded-full focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600 cursor-pointer"
          aria-expanded="false"
          (click)="toggleUserMenu()"
        >
          <img
            class="w-8 h-8 rounded-full"
            src="https://flowbite.com/docs/images/people/profile-picture-5.jpg"
            alt="user photo"
          />
        </button>
      </div>

      <div
        class="min-w-48 absolute top-10 right-10 z-50 my-4 text-base list-none bg-white divide-y divide-gray-100 rounded-sm shadow-sm dark:bg-gray-700 dark:divide-gray-600"
        [ngClass]="{ visible: isMenuOpen(), hidden: !isMenuOpen() }"
      >
        <ul class="py-1" role="none">
          <li>
            <a
              routerLink="/users-list"
              (click)="toggleUserMenu()"
              class="font-bold underline block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
              role="menuitem"
              >Users List
            </a>
          </li>
          <li>
            <a
              routerLink="/add-user"
              (click)="toggleUserMenu()"
              class="font-bold underline block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
              role="menuitem"
              >Add New User</a
            >
          </li>
          <li>
            <a
              class="font-bold underline block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
              role="menuitem"
              >demo</a
            >
          </li>
          <li>
            <a
              class="font-bold underline block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
              role="menuitem"
              >demo
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
