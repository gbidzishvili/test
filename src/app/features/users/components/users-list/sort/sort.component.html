<button
  id="dropdownActionButton"
  data-dropdown-toggle="dropdownAction"
  class="inline-flex items-center gap-3 text-gray-500 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-3 py-1.5 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700"
  type="button"
  (click)="this.isSortMenuOpen.set(!this.isSortMenuOpen())"
  (clickOutside)="closeSortMenu()"
>
  <span class="sr-only">Action button</span>
  sort
  <span class="material-symbols-outlined"> sort </span>
</button>
<div
  class="absolute top-10 left-0 z-10 bg-white divide-y divide-gray-100 rounded-lg shadow-sm w-44 dark:bg-gray-700 dark:divide-gray-600"
  [ngClass]="{ hidden: !isSortMenuOpen(), block: isSortMenuOpen() }"
>
  <ul class="py-1 text-sm text-gray-700 dark:text-gray-200">
    @for(filter of filters();track filter.id){
    <li
      (click)="sortUsers(filter.label)"
      class="border-b border-gray-100 last:border-none"
    >
      <a
        class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white"
        >{{ filter.label }}</a
      >
    </li>
    }
  </ul>
</div>
