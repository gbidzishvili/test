<table
  class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400"
>
  <thead
    class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
  >
    <tr>
      @for(col of cols();track col){
      <th scope="col" class="px-6 py-3">{{ col }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for(user of data();track user.id){

    <tr
      class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 cursor-pointer"
      (click)="goToDetails(user.id)"
      tooltip
      [tooltipText]="'view user details'"
    >
      <th
        scope="row"
        class="flex items-center px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white"
      >
        <img
          class="w-10 h-10 rounded-full"
          [src]="user.image"
          default="assets/images/no-user.png"
          alt="Jese image"
        />
        <div class="ps-3">
          <div class="text-base font-semibold">{{ user.firstname }}</div>
          <div class="font-normal text-gray-500">
            {{ user?.physicalAddress.country }},
            {{ user?.physicalAddress.city }}
          </div>
        </div>
      </th>
      <td class="px-6 py-4">
        {{ user.mobileNumber }}
      </td>
      <td class="px-6 py-4">
        <div class="flex items-center">
          {{ user.personalNumber }}
        </div>
      </td>
      <td class="px-6 py-4">
        <a class="font-medium text-blue-600 dark:text-blue-500 hover:underline"
          >Edit user</a
        >
      </td>
    </tr>
    }
  </tbody>
</table>
