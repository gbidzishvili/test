<div
  class="relative overflow-x-auto shadow-md sm:rounded-lg w-8/10 my-[100px] mx-auto"
>
  <div
    class="flex items-center justify-between flex-column flex-wrap p-4 pt-5 md:flex-row space-y-4 md:space-y-0 pb-4 bg-white dark:bg-gray-900 gap-[5px]"
  >
    <div class="relative">
      <app-sort></app-sort>
    </div>
    <label for="table-search" class="sr-only">Search</label>
    <div class="relative">
      <app-search></app-search>
    </div>
  </div>
  <app-list
    [cols]="['Name', 'PN', 'Mobile Number', 'Action']"
    [data]="users()"
  ></app-list>
  <app-pagination></app-pagination>
</div>
