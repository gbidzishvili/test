@if(!imageUrl()){

<div
  (click)="onClick()"
  class="flex justify-center items-center h-80 w-72 border cursor-pointer mb-1 rounded-lg"
>
  <div
    class="flex flex-col justify-center items-center gap-3 max-w-[400px] text-[#5A5A5A] font-semibold text-c-normal leading-[21.76px] rounded-lg"
    style="width: 100%; background: #fff; height: 100%"
  >
    <img src="assets/images/account_image.svg" alt="file image" />
    <div>Click to upload</div>
  </div>
</div>

}@else{
<div class="flex flex-wrap gap-2 relative h-80 w-72 border rounded-lg">
  <img
    width="200px"
    height="127px"
    [src]="imageUrl()"
    class="rounded-lg w-full"
  />

  <div
    class="absolute flex justify-center items-center gap-1 top-0 right-0 my-3 mx-1"
  >
    <div
      class="flex justify-center items-center rounded-lg bg-light-gray cursor-pointer"
      (click)="edit()"
    >
      <div
        class="flex justify-center items-center bg-white hover:bg-light-gray rounded-full p-2"
      >
        <span class="material-symbols-outlined"> edit </span>
      </div>
    </div>
    <div
      class="flex justify-center items-center rounded-lg bg-light-gray cursor-pointer"
      (click)="delete()"
    >
      <div
        class="flex justify-center items-center bg-white hover:bg-light-gray rounded-full p-2"
      >
        <span class="material-symbols-outlined"> delete </span>
      </div>
    </div>
  </div>
</div>

}

<input (input)="log($event)" type="file" #uploader class="hidden" />
